# Wave 40 — NEW as of the hub/spoke observability re-split. Runs ONLY the
# aggregator half of platform/charts/otel (collectorDaemonSet.enabled:
# false, collectorDeployment.enabled: true — see
# platform/values/hub/otel.yaml). Needs the OTel Operator CRDs
# (20-opentelemetry-operator.yaml, wave "20") and exports to Tempo/Loki,
# also wave "40" — same same-wave-parallel pattern already used for this
# chart on spoke before the split; the collector just retries/backs off if
# it briefly starts before its exporters' targets are ready.
#
# valueFiles path is relative from the chart directory (platform/charts/otel)
# to platform/values/hub/otel.yaml — both live in this same repo, so no
# multi-source $values ref is needed for this one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collectors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-hub
  source:
    repoURL: https://github.com/trandinhphuoc1198/k8s_ArgoCD.git
    targetRevision: main
    path: platform/charts/otel
    helm:
      releaseName: otel
      valueFiles:
        - ../../values/hub/otel.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
