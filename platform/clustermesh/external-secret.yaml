# platform/clustermesh/external-secret.yaml
#
# Pulls the shared Cluster Mesh root CA (generated ONCE, out-of-band, and
# pushed to AWS Secrets Manager — see the "One-time setup" note below) into
# every cluster as a kubernetes.io/tls Secret named "clustermesh-ca" in the
# cert-manager namespace. ca-issuer.yaml (this directory) references that
# Secret name directly.
#
# References secret-store.yaml (this directory) — a SecretStore deployed
# per-cluster (NOT the hub-only "argocd-clusters-store" ClusterSecretStore
# used for spoke registration; see that file's header for why this can't
# be shared across clusters). IMPORTANT: whatever AWS credentials back
# that store (instance-profile IAM by default — see secret-store.yaml)
# need secretsmanager:GetSecretValue on "clustermesh/*". That IAM change
# lives in Terraform, outside this repo.
#
# ── One-time setup (run once, by hand, before this Application first
#    syncs on ANY cluster — every cluster must converge on the same root) ──
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P256 \
#     -keyout ca.key -out ca.crt -days 3650 -nodes \
#     -subj "/CN=clustermesh-ca"
#   aws secretsmanager create-secret \
#     --name clustermesh/ca \
#     --secret-string "$(jq -n --arg crt "$(cat ca.crt)" --arg key "$(cat ca.key)" \
#         '{"tls.crt":$crt,"tls.key":$key}')" \
#     --region ap-northeast-1
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clustermesh-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clustermesh-secrets-store
    kind: SecretStore
  target:
    name: clustermesh-ca
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: clustermesh/ca
