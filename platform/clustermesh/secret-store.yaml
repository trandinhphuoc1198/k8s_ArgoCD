# platform/clustermesh/secret-store.yaml
#
# Deployed identically to the hub AND every spoke (same platform/clustermesh
# directory, applied by both argocd/hub/25-clustermesh-ca.yaml and
# argocd/spokes/infra/25-clustermesh-ca.yaml). Deliberately NOT the hub's
# existing "argocd-clusters-store" ClusterSecretStore — that resource is
# cluster-scoped and only lives on the hub (created by a hub-only
# Application); ESO's CRs are always cluster-local, so a spoke can't
# reference a store object that only exists on the hub's API server. Every
# meshed cluster needs its own copy of this SecretStore.
#
# Auth: no secretRef here — relies on the node's EC2 instance-profile IAM
# role (default AWS SDK credential chain) rather than a static aws-creds
# k8s Secret. This mirrors the existing (already-unverified-in-production)
# assumption the root README documents for Tempo's S3 access
# ("Tempo S3 credentials rely on instance-profile IAM"). Confirm each
# node's instance profile actually grants
# secretsmanager:GetSecretValue on "clustermesh/ca" before relying on this
# — if it doesn't, switch this to a secretRef-based aws-creds Secret
# (same shape as platform/external-secrets-config/cluster-secret-store.yaml)
# distributed per cluster instead.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: clustermesh-secrets-store
  namespace: cert-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
